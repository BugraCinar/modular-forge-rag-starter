[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modular-forge-rag-fastapi-integration"
version = "1.0.0"
description = "Optional RAG gateway module for the Modular Forge FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "PyJWT>=2.10.1,<3", "pydantic-settings>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["forge_rag_integration"]
