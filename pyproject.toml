[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modular-forge-rag"
version = "1.0.0"
description = "Modular, tenant-aware RAG service with FastAPI and Spring Boot integration modules"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
authors = [{name = "Bugra Cinar"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0.38,<2.1",
  "PyJWT>=2.10.1,<3", "httpx>=0.28,<1",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1"]
pdf = ["pypdf>=6,<8"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3", "build>=1.2,<2"]

[project.scripts]
forge-rag = "forge_rag.cli:main"

[project.urls]
Repository = "https://github.com/BugraCinar/modular-forge-rag-starter"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "integrations/fastapi"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
